apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
 name: {{ include "integration-chart-prod.fullname" . }}-hpa
 namespace: {{ .Release.Namespace }}
spec:
 scaleTargetRef:
   apiVersion: apps/v1
   kind: Deployment
   name: {{ include "integration-chart-prod.fullname" . }}
 minReplicas: 2
 maxReplicas: 6
 metrics:
   - type: Resource
     resource:
       name: cpu
       target:
         type: Utilization
         averageUtilization: 70
   - type: Resource
     resource:
       name: memory
       target:
         type: Utilization
         averageUtilization: 75
