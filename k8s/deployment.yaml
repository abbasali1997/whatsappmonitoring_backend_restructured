apiVersion: apps/v1
kind: Deployment
metadata:
  name: unicx-backend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unicx-backend
  template:
    metadata:
      labels:
        app: unicx-backend
    spec:
      containers:
      - name: backend
        image: unicxprod.azurecr.io/backend:latest
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: unicx-backend-secrets
        volumeMounts:
        - name: kv-secrets
          mountPath: /mnt/secrets-store
          readOnly: true
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: /api/v1/health/live
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /api/v1/health/live
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health/live
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: kv-secrets
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: unicx-backend-kv