trigger:
  branches:
    include:
      - dev

variables:
  acrName: 'unicxprod'
  acrLoginServer: 'unicxprod.azurecr.io'
  imageName: 'backend-v2'
  kubernetesNamespace: 'default'
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: 'Build and Push Docker Image (v2)'
  jobs:
  - job: BuildJob
    displayName: 'Build Docker Image'
    pool:
      name: self-hosted
    steps:
    - task: Docker@2
      displayName: 'Build and Push backend-v2 to ACR'
      inputs:
        containerRegistry: 'unicx-acr-prod'
        repository: '$(imageName)'
        command: 'buildAndPush'
        Dockerfile: 'backend_restructured/Dockerfile'
        buildContext: 'backend_restructured'
        tags: |
          $(tag)
          latest

- stage: Deploy
  displayName: 'Deploy v2 to AKS'
  dependsOn: Build
  jobs:
  - deployment: DeployJob
    displayName: 'Deploy to Kubernetes'
    pool:
      name: self-hosted
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: KubernetesManifest@1
            displayName: 'Apply SecretProviderClass'
            inputs:
              action: 'deploy'
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceConnection: 'unicx-aks-prod'
              namespace: '$(kubernetesNamespace)'
              manifests: 'backend_restructured/k8s-v2/secretproviderclass.yaml'

          - task: KubernetesManifest@1
            displayName: 'Apply PodDisruptionBudget'
            inputs:
              action: 'deploy'
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceConnection: 'unicx-aks-prod'
              namespace: '$(kubernetesNamespace)'
              manifests: 'backend_restructured/k8s-v2/pdb.yaml'

          - task: KubernetesManifest@1
            displayName: 'Deploy API and Worker'
            inputs:
              action: 'deploy'
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceConnection: 'unicx-aks-prod'
              namespace: '$(kubernetesNamespace)'
              manifests: |
                backend_restructured/k8s-v2/deployment-api.yaml
                backend_restructured/k8s-v2/deployment-worker.yaml
              containers: '$(acrLoginServer)/$(imageName):$(tag)'

          - task: KubernetesManifest@1
            displayName: 'Apply Service'
            inputs:
              action: 'deploy'
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceConnection: 'unicx-aks-prod'
              namespace: '$(kubernetesNamespace)'
              manifests: 'backend_restructured/k8s-v2/service.yaml'
